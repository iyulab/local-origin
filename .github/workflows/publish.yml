name: Publish to NuGet

# Runs only when the declared version changes (or by hand). A version that already has a tag is skipped,
# so re-running is safe. This workflow holds no NuGet credential: it packs, uploads the packages as an artifact,
# and the organization's central publisher (iyulab/nuget-publish) pushes them to nuget.org. The version tag is
# pushed only after that publish succeeds.
on:
  push:
    branches: [ main ]
    paths:
      - 'Directory.Build.props'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.check_tag.outputs.exists }}

    steps:
    - uses: actions/checkout@v4

    - name: Read version from Directory.Build.props
      id: version
      run: |
        VERSION=$(grep -oP '<Version>\K[^<]+' Directory.Build.props)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Version: $VERSION"

    - name: Skip if the version is already tagged
      id: check_tag
      run: |
        if git ls-remote --tags origin "v${{ steps.version.outputs.version }}" | grep -q .; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "v${{ steps.version.outputs.version }} already exists — nothing to publish"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup .NET
      if: steps.check_tag.outputs.exists == 'false'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build
      if: steps.check_tag.outputs.exists == 'false'
      run: dotnet build LocalOrigin.slnx --configuration Release

    - name: Test
      if: steps.check_tag.outputs.exists == 'false'
      run: dotnet test --solution LocalOrigin.slnx --no-build --configuration Release

    # Pack the whole solution rather than naming projects, then check every packable project produced
    # its package — a package that is never produced cannot fail to push, so the gap would stay silent.
    - name: Pack
      if: steps.check_tag.outputs.exists == 'false'
      run: dotnet pack LocalOrigin.slnx --no-build --configuration Release --output ./nupkg

    - name: Verify every packable project was produced
      if: steps.check_tag.outputs.exists == 'false'
      run: |
        version="${{ steps.version.outputs.version }}"
        missing=0
        for csproj in $(grep -oP '(?<=Path=")src/[^"]+\.csproj' LocalOrigin.slnx); do
          id=$(grep -oP '(?<=<PackageId>)[^<]+' "$csproj" || basename "$csproj" .csproj)
          if [ ! -f "./nupkg/${id}.${version}.nupkg" ]; then
            echo "::error::${id}.${version}.nupkg was not produced"
            missing=1
          fi
        done
        [ "$missing" -eq 0 ]

    # The central publisher accepts only .nupkg / .snupkg files in this artifact.
    - name: Upload the packages
      if: steps.check_tag.outputs.exists == 'false'
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: |
          nupkg/*.nupkg
          nupkg/*.snupkg
        if-no-files-found: error
        retention-days: 1

  publish:
    needs: pack
    if: needs.pack.outputs.exists == 'false'
    uses: iyulab/nuget-publish/.github/workflows/request.yml@2166748abf716fb58855228f65fc6b8f78c2780f # main
    permissions: {}
    secrets: inherit

  tag:
    needs: [pack, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # push the version tag
    steps:
    - uses: actions/checkout@v4

    - name: Tag the version
      run: |
        git tag "v${{ needs.pack.outputs.version }}"
        git push origin "v${{ needs.pack.outputs.version }}"
